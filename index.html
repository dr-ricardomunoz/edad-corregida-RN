<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad Corregida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .alert-blue { background-color: #eff6ff; border-left: 4px solid #3b82f6; color: #1e3a8a; }
        .alert-yellow { background-color: #fefce8; border-left: 4px solid #eab308; color: #854d0e; }
        .alert-red { background-color: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; }
        .alert-green { background-color: #f0fdf4; border-left: 4px solid #22c55e; color: #166534; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-start min-h-screen">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <h1 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-6">Calculadora de Edad Corregida</h1>

        <!-- Formulario de Entrada -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Evaluación</label>
                <input type="date" id="fechaEvaluacion" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Edad Gestacional (Semanas)</label>
                <input type="number" id="semanas" min="20" max="42" placeholder="Ej: 32" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Edad Gestacional (Días)</label>
                <input type="number" id="dias" min="0" max="6" value="0" placeholder="Ej: 0" class="w-full border border-gray-300 rounded-md shadow-sm p-2.5 focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            
        </div>

        <button onclick="calcularEdad()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-md transition duration-200 shadow-sm">
            Calcular Edad
        </button>

        <!-- Resultados -->
        <div id="resultados" class="hidden mt-8 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-50 rounded-lg p-5 border border-gray-200">
                    <h3 class="text-xs uppercase tracking-wider font-semibold text-gray-500 mb-1">Edad Cronológica</h3>
                    <p id="edadCronologica" class="text-lg font-bold text-gray-800">-</p>
                </div>
                
                <div class="bg-blue-50 rounded-lg p-5 border border-blue-200 shadow-sm">
                    <h3 class="text-xs uppercase tracking-wider font-semibold text-blue-600 mb-1">Edad Corregida</h3>
                    <p id="edadCorregida" class="text-xl font-bold text-blue-900">-</p>
                </div>
            </div>

            <!-- Clasificación y Límite -->
            <div id="panelClasificacion" class="rounded-lg p-4 text-sm leading-relaxed border">
                <p><strong>Clasificación:</strong> <span id="clasificacionTexto">-</span></p>
                <p><strong>Criterio de Corrección:</strong> <span id="criterioTexto">-</span></p>
                <p id="estadoCorreccion" class="mt-2 font-semibold"></p>
            </div>

            <!-- Recordatorios Normativos -->
            <div class="alert-yellow p-4 rounded-lg text-sm">
                <h4 class="font-bold mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Recordatorio Clínico
                </h4>
                <ul class="list-disc pl-5 space-y-1">
                    <li><strong>Controles de Salud y Desarrollo (DSM):</strong> Utilizar Edad Corregida.</li>
                    <li><strong>Programa Nacional de Inmunizaciones (Vacunas):</strong> Utilizar Edad Cronológica.</li>
                </ul>
            </div>

        </div>

    </div>

    <script>
        // Inicializar fecha de evaluación con la fecha actual local
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('fechaEvaluacion').value = `${year}-${month}-${day}`;
        });

        // Parsear fecha local evitando desfases de zona horaria
        function parseDateLocal(dateString) {
            if (!dateString) return null;
            const [year, month, day] = dateString.split('-');
            return new Date(year, month - 1, day);
        }

        // Calcula la diferencia en años, meses y días entre dos fechas
        function calcularDiferencia(fechaInicio, fechaFin) {
            if (fechaInicio > fechaFin) return null;

            let years = fechaFin.getFullYear() - fechaInicio.getFullYear();
            let months = fechaFin.getMonth() - fechaInicio.getMonth();
            let days = fechaFin.getDate() - fechaInicio.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(fechaFin.getFullYear(), fechaFin.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            return { years, months, days, totalMonths: (years * 12) + months };
        }

        // Formatea el objeto de edad en texto legible
        function formatEdad(edadObj) {
            if (!edadObj) return "N/A";
            const partes = [];
            if (edadObj.years > 0) partes.push(`${edadObj.years} año${edadObj.years > 1 ? 's' : ''}`);
            if (edadObj.months > 0) partes.push(`${edadObj.months} mes${edadObj.months > 1 ? 'es' : ''}`);
            if (edadObj.days > 0 || partes.length === 0) partes.push(`${edadObj.days} día${edadObj.days !== 1 ? 's' : ''}`);
            
            if (partes.length === 1) return partes[0];
            if (partes.length === 2) return `${partes[0]} y ${partes[1]}`;
            return `${partes[0]}, ${partes[1]} y ${partes[2]}`;
        }

        function calcularEdad() {
            const dobInput = document.getElementById('fechaNacimiento').value;
            const evalInput = document.getElementById('fechaEvaluacion').value;
            const semanas = parseInt(document.getElementById('semanas').value);
            const dias = parseInt(document.getElementById('dias').value) || 0;

            if (!dobInput || !evalInput || isNaN(semanas)) {
                alert("Por favor, complete todos los campos obligatorios.");
                return;
            }

            const DOB = parseDateLocal(dobInput);
            const EvalDate = parseDateLocal(evalInput);

            if (EvalDate < DOB) {
                alert("La fecha de evaluación no puede ser anterior a la fecha de nacimiento.");
                return;
            }

            // 1. Edad Cronológica
            const edadCrono = calcularDiferencia(DOB, EvalDate);
            document.getElementById('edadCronologica').textContent = formatEdad(edadCrono);

            // 2. Clasificación y Límite de Corrección
            let clasificacion = "";
            let limiteMeses = 0;
            let criterioTexto = "";
            let colorClase = "";

            if (semanas >= 37) {
                clasificacion = "Recién Nacido de Término";
                criterioTexto = "No requiere corrección de edad.";
                limiteMeses = 0;
                colorClase = "alert-green";
            } else if (semanas < 32) {
                clasificacion = "Prematuro Extremo";
                criterioTexto = "Hasta los 24 meses de edad corregida.";
                limiteMeses = 24;
                colorClase = "alert-red";
            } else if (semanas >= 32 && semanas <= 33) {
                clasificacion = "Prematuro Moderado";
                criterioTexto = "Hasta los 12 meses de edad corregida.";
                limiteMeses = 12;
                colorClase = "alert-yellow"; // Color ajustado para moderado
                // Asegurar que 33+6 entra aquí (ya que semanas es int 32 o 33)
            } else if (semanas >= 34 && semanas <= 36) {
                clasificacion = "Prematuro Tardío";
                criterioTexto = "Hasta los 6 meses de edad corregida.";
                limiteMeses = 6;
                colorClase = "alert-green"; // Color ajustado de la tabla original
            }

            document.getElementById('clasificacionTexto').textContent = clasificacion;
            document.getElementById('criterioTexto').textContent = criterioTexto;

            // 3. Edad Corregida
            const diasFaltantes = (40 * 7) - ((semanas * 7) + dias);
            const FPP = new Date(DOB.getTime() + (diasFaltantes * 24 * 60 * 60 * 1000));
            
            const edadCorregidaEl = document.getElementById('edadCorregida');
            const estadoCorreccionEl = document.getElementById('estadoCorreccion');
            const panelClasificacion = document.getElementById('panelClasificacion');
            
            // Reset panel classes
            panelClasificacion.className = `rounded-lg p-4 text-sm leading-relaxed border ${colorClase}`;

            if (semanas >= 37) {
                edadCorregidaEl.textContent = "No aplica (Término)";
                estadoCorreccionEl.textContent = "";
            } else {
                if (EvalDate < FPP) {
                    // Aún no llega a las 40 semanas
                    const diasPostConcepcional = (semanas * 7) + dias + Math.floor((EvalDate - DOB) / (1000 * 60 * 60 * 24));
                    const semPost = Math.floor(diasPostConcepcional / 7);
                    const diasPost = diasPostConcepcional % 7;
                    edadCorregidaEl.textContent = `${semPost} semanas y ${diasPost} días (Edad Post-concepcional)`;
                    estadoCorreccionEl.textContent = "Paciente en periodo post-concepcional (< 40 semanas).";
                    estadoCorreccionEl.className = "mt-2 font-semibold text-blue-700";
                } else {
                    const edadCorregidaObj = calcularDiferencia(FPP, EvalDate);
                    
                    // Verificar si superó el límite de corrección
                    if (edadCorregidaObj.totalMonths >= limiteMeses) {
                        edadCorregidaEl.textContent = formatEdad(edadCorregidaObj);
                        estadoCorreccionEl.innerHTML = `⚠️ <strong>Límite Superado:</strong> El paciente alcanzó los ${limiteMeses} meses. Ya no se debe corregir la edad. Evaluar con Edad Cronológica.`;
                        estadoCorreccionEl.className = "mt-2 font-semibold text-red-700";
                    } else {
                        edadCorregidaEl.textContent = formatEdad(edadCorregidaObj);
                        estadoCorreccionEl.textContent = "✓ Edad dentro del periodo de corrección establecido.";
                        estadoCorreccionEl.className = "mt-2 font-semibold text-green-700";
                    }
                }
            }

            document.getElementById('resultados').classList.remove('hidden');
        }
    </script>
</body>
</html>
